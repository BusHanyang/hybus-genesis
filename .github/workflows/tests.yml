name: Tests

on: [pull_request]

permissions:
  contents: read

jobs:
  test:
    name: GPS and crowding tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run GPS tests
        run: yarn test:gps
      - name: Run crowding tests
        run: yarn test:crowding
